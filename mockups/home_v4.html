<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jotihunt - V4 Glassmorphism</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://kit.fontawesome.com/870ab34ea3.js" crossorigin="anonymous"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Outfit', sans-serif; } </style>
</head>
<body class="bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 text-white flex h-screen overflow-hidden">
  <!-- Sidebar -->
  <aside class="w-64 bg-white/10 backdrop-blur-xl hidden md:flex flex-col border-r border-white/20">
    <div class="h-16 flex items-center justify-center border-b border-white/20">
      <h1 class="text-2xl font-bold text-white tracking-wide">Jotihunt</h1>
    </div>
    <nav class="flex-1 p-4 space-y-2">
      <a href="#" class="flex items-center space-x-3 text-white bg-white/20 px-4 py-3 rounded-2xl font-medium shadow-lg backdrop-blur-md border border-white/30"><i class="fas fa-home w-5"></i><span>Overzicht</span></a>
      <a href="#" class="flex items-center space-x-3 text-white/70 hover:text-white hover:bg-white/10 px-4 py-3 rounded-2xl font-medium transition"><i class="fas fa-map-marked-alt w-5"></i><span>Kaart</span></a>
      <a href="#" class="flex items-center space-x-3 text-white/70 hover:text-white hover:bg-white/10 px-4 py-3 rounded-2xl font-medium transition"><i class="fas fa-tasks w-5"></i><span>Opdrachten</span></a>
    </nav>
  </aside>

  <!-- Main Content -->
  <div class="flex-1 flex flex-col h-screen overflow-y-auto">
    <!-- Topbar -->
    <header class="h-16 bg-white/10 backdrop-blur-xl flex items-center justify-between px-6 sticky top-0 z-10 border-b border-white/20">
      <div class="flex items-center">
        <button class="md:hidden text-white/70 hover:text-white mr-4"><i class="fas fa-bars text-xl"></i></button>
        <h2 class="text-xl font-semibold text-white"><i class="fas fa-tachometer-alt mr-2 text-white/50"></i> Overzicht</h2>
      </div>
      <div class="flex items-center space-x-4">
        <button class="text-white/70 hover:text-white transition"><i class="fas fa-crosshairs text-xl"></i></button>
        <div class="w-10 h-10 rounded-full bg-white/20 border border-white/30 text-white flex items-center justify-center font-bold shadow-lg backdrop-blur-md">N</div>
      </div>
    </header>

    <main class="p-6 lg:p-8 max-w-7xl mx-auto w-full">
      <!-- Stats -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
        <div class="bg-white/10 backdrop-blur-xl rounded-3xl p-6 border border-white/20 flex items-center shadow-[0_8px_32px_0_rgba(31,38,135,0.37)]">
          <div class="w-14 h-14 rounded-2xl bg-red-400/20 text-red-200 flex items-center justify-center text-2xl mr-4 border border-red-400/30"><i class="fas fa-trophy"></i></div>
          <div><p class="text-white/70 text-sm font-medium">Punten</p><h3 class="text-2xl font-bold text-white">1250</h3></div>
        </div>
        <div class="bg-white/10 backdrop-blur-xl rounded-3xl p-6 border border-white/20 flex items-center shadow-[0_8px_32px_0_rgba(31,38,135,0.37)]">
          <div class="w-14 h-14 rounded-2xl bg-orange-400/20 text-orange-200 flex items-center justify-center text-2xl mr-4 border border-orange-400/30"><i class="fas fa-star"></i></div>
          <div><p class="text-white/70 text-sm font-medium">Plaats</p><h3 class="text-2xl font-bold text-white">4e</h3></div>
        </div>
        <div class="bg-white/10 backdrop-blur-xl rounded-3xl p-6 border border-white/20 flex items-center shadow-[0_8px_32px_0_rgba(31,38,135,0.37)]">
          <div class="w-14 h-14 rounded-2xl bg-blue-400/20 text-blue-200 flex items-center justify-center text-2xl mr-4 border border-blue-400/30"><i class="fas fa-bullseye"></i></div>
          <div><p class="text-white/70 text-sm font-medium">Hunts</p><h3 class="text-2xl font-bold text-white">12</h3></div>
        </div>
        <div class="bg-white/10 backdrop-blur-xl rounded-3xl p-6 border border-white/20 flex items-center shadow-[0_8px_32px_0_rgba(31,38,135,0.37)]">
          <div class="w-14 h-14 rounded-2xl bg-teal-400/20 text-teal-200 flex items-center justify-center text-2xl mr-4 border border-teal-400/30"><i class="fas fa-question-circle"></i></div>
          <div><p class="text-white/70 text-sm font-medium">Hints</p><h3 class="text-2xl font-bold text-white">5</h3></div>
        </div>
      </div>

      <!-- Panels -->
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="lg:col-span-1 space-y-6">
          <div class="bg-white/10 backdrop-blur-xl rounded-3xl p-6 border border-white/20 shadow-[0_8px_32px_0_rgba(31,38,135,0.37)]">
            <div class="flex justify-between items-center mb-4">
              <h4 class="font-semibold text-white">Invulgegevens</h4>
              <button class="text-white/50 hover:text-white transition"><i class="fas fa-redo-alt"></i></button>
            </div>
            <div class="text-sm text-white/70">Wachtend op data...</div>
          </div>
          <div class="bg-white/10 backdrop-blur-xl rounded-3xl p-6 border border-white/20 shadow-[0_8px_32px_0_rgba(31,38,135,0.37)]">
            <div class="flex justify-between items-center mb-4">
              <h4 class="font-semibold text-white">Auto's onderweg</h4>
              <button class="text-white/50 hover:text-white transition"><i class="fas fa-redo-alt"></i></button>
            </div>
            <div class="space-y-3">
              <div class="flex items-center justify-between p-3 bg-white/5 rounded-2xl border border-white/10">
                <span class="font-medium text-white">Team Alpha</span><span class="text-xs bg-green-400/30 text-green-100 px-3 py-1 rounded-full border border-green-400/50 backdrop-blur-md">Rijdend</span>
              </div>
            </div>
          </div>
        </div>
        <div class="lg:col-span-2">
          <div class="bg-white/10 backdrop-blur-xl rounded-3xl p-6 border border-white/20 shadow-[0_8px_32px_0_rgba(31,38,135,0.37)] h-full">
            <div class="flex justify-between items-center mb-4">
              <h4 class="font-semibold text-white">Gebeurtenissen</h4>
              <button class="text-white/50 hover:text-white transition"><i class="fas fa-redo-alt"></i></button>
            </div>
            <div class="space-y-4">
              <div class="flex items-start p-4 bg-white/5 rounded-2xl border border-white/10">
                <div class="w-10 h-10 rounded-full bg-blue-400/20 text-blue-200 flex items-center justify-center mr-4 flex-shrink-0 border border-blue-400/30"><i class="fas fa-info"></i></div>
                <div>
                  <p class="text-white text-sm">Nieuwe hint gepubliceerd voor regio Alpha.</p>
                  <p class="text-xs text-white/50 mt-1">10 minuten geleden</p>
                </div>
              </div>
              <div class="flex items-start p-4 bg-white/5 rounded-2xl border border-white/10">
                <div class="w-10 h-10 rounded-full bg-red-400/20 text-red-200 flex items-center justify-center mr-4 flex-shrink-0 border border-red-400/30"><i class="fas fa-bullseye"></i></div>
                <div>
                  <p class="text-white text-sm">Hunt gemeld door team Bravo.</p>
                  <p class="text-xs text-white/50 mt-1">35 minuten geleden</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
