<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jotihunt - V3 Playful Brutalism</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://kit.fontawesome.com/870ab34ea3.js" crossorigin="anonymous"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Space Grotesk', sans-serif; background-image: radial-gradient(#d1d5db 1px, transparent 1px); background-size: 20px 20px; } </style>
</head>
<body class="bg-yellow-50 text-black flex h-screen overflow-hidden">
  <!-- Sidebar -->
  <aside class="w-64 bg-white hidden md:flex flex-col border-r-4 border-black">
    <div class="h-16 flex items-center justify-center border-b-4 border-black bg-yellow-300">
      <h1 class="text-2xl font-bold uppercase tracking-widest">Jotihunt</h1>
    </div>
    <nav class="flex-1 p-4 space-y-4">
      <a href="#" class="flex items-center space-x-3 text-black bg-blue-300 px-4 py-3 border-2 border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] font-bold hover:translate-y-1 hover:shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] transition-all"><i class="fas fa-home w-5"></i><span>Overzicht</span></a>
      <a href="#" class="flex items-center space-x-3 text-black bg-white px-4 py-3 border-2 border-black font-bold hover:bg-gray-100 transition-all"><i class="fas fa-map-marked-alt w-5"></i><span>Kaart</span></a>
      <a href="#" class="flex items-center space-x-3 text-black bg-white px-4 py-3 border-2 border-black font-bold hover:bg-gray-100 transition-all"><i class="fas fa-tasks w-5"></i><span>Opdrachten</span></a>
    </nav>
  </aside>

  <!-- Main Content -->
  <div class="flex-1 flex flex-col h-screen overflow-y-auto">
    <!-- Topbar -->
    <header class="h-16 bg-white flex items-center justify-between px-6 sticky top-0 z-10 border-b-4 border-black">
      <div class="flex items-center">
        <button class="md:hidden text-black hover:text-gray-700 mr-4"><i class="fas fa-bars text-xl"></i></button>
        <h2 class="text-2xl font-bold uppercase"><i class="fas fa-tachometer-alt mr-2 text-black"></i> Overzicht</h2>
      </div>
      <div class="flex items-center space-x-4">
        <button class="text-black hover:scale-110 transition-transform"><i class="fas fa-crosshairs text-2xl"></i></button>
        <div class="w-10 h-10 border-2 border-black bg-pink-300 text-black flex items-center justify-center font-bold text-lg shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]">N</div>
      </div>
    </header>

    <main class="p-6 lg:p-8 max-w-7xl mx-auto w-full">
      <!-- Stats -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
        <div class="bg-red-300 p-6 border-4 border-black shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] flex items-center hover:-translate-y-1 hover:shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] transition-all">
          <div class="text-black text-4xl mr-4"><i class="fas fa-trophy"></i></div>
          <div><p class="text-black font-bold uppercase text-sm">Punten</p><h3 class="text-3xl font-black">1250</h3></div>
        </div>
        <div class="bg-orange-300 p-6 border-4 border-black shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] flex items-center hover:-translate-y-1 hover:shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] transition-all">
          <div class="text-black text-4xl mr-4"><i class="fas fa-star"></i></div>
          <div><p class="text-black font-bold uppercase text-sm">Plaats</p><h3 class="text-3xl font-black">4e</h3></div>
        </div>
        <div class="bg-blue-300 p-6 border-4 border-black shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] flex items-center hover:-translate-y-1 hover:shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] transition-all">
          <div class="text-black text-4xl mr-4"><i class="fas fa-bullseye"></i></div>
          <div><p class="text-black font-bold uppercase text-sm">Hunts</p><h3 class="text-3xl font-black">12</h3></div>
        </div>
        <div class="bg-green-300 p-6 border-4 border-black shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] flex items-center hover:-translate-y-1 hover:shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] transition-all">
          <div class="text-black text-4xl mr-4"><i class="fas fa-question-circle"></i></div>
          <div><p class="text-black font-bold uppercase text-sm">Hints</p><h3 class="text-3xl font-black">5</h3></div>
        </div>
      </div>

      <!-- Panels -->
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="lg:col-span-1 space-y-6">
          <div class="bg-white p-6 border-4 border-black shadow-[6px_6px_0px_0px_rgba(0,0,0,1)]">
            <div class="flex justify-between items-center mb-4 border-b-4 border-black pb-2">
              <h4 class="font-bold text-xl uppercase">Invulgegevens</h4>
              <button class="text-black hover:rotate-180 transition-transform"><i class="fas fa-redo-alt text-xl"></i></button>
            </div>
            <div class="font-bold text-gray-500">Niks te zien hier.</div>
          </div>
          <div class="bg-white p-6 border-4 border-black shadow-[6px_6px_0px_0px_rgba(0,0,0,1)]">
            <div class="flex justify-between items-center mb-4 border-b-4 border-black pb-2">
              <h4 class="font-bold text-xl uppercase">Auto's onderweg</h4>
              <button class="text-black hover:rotate-180 transition-transform"><i class="fas fa-redo-alt text-xl"></i></button>
            </div>
            <div class="space-y-3">
              <div class="flex items-center justify-between p-3 border-2 border-black bg-pink-100">
                <span class="font-black uppercase">Alpha</span><span class="text-xs bg-green-300 border-2 border-black px-2 py-1 font-bold shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]">Rijdend</span>
              </div>
            </div>
          </div>
        </div>
        <div class="lg:col-span-2">
          <div class="bg-white p-6 border-4 border-black shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] h-full">
            <div class="flex justify-between items-center mb-4 border-b-4 border-black pb-2">
              <h4 class="font-bold text-xl uppercase">Gebeurtenissen</h4>
              <button class="text-black hover:rotate-180 transition-transform"><i class="fas fa-redo-alt text-xl"></i></button>
            </div>
            <div class="space-y-4">
              <div class="flex items-start p-4 border-2 border-black bg-blue-50 shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]">
                <div class="text-blue-500 text-3xl mr-4"><i class="fas fa-info-circle"></i></div>
                <div>
                  <p class="font-bold text-lg">Nieuwe hint gepubliceerd voor regio Alpha.</p>
                  <p class="font-bold text-gray-500 border-t-2 border-black mt-2 pt-1 inline-block">10 min geleden</p>
                </div>
              </div>
              <div class="flex items-start p-4 border-2 border-black bg-red-50 shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]">
                <div class="text-red-500 text-3xl mr-4"><i class="fas fa-bullseye"></i></div>
                <div>
                  <p class="font-bold text-lg">Hunt gemeld door team Bravo.</p>
                  <p class="font-bold text-gray-500 border-t-2 border-black mt-2 pt-1 inline-block">35 min geleden</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
